services:
  app:
    build: .
    image: tower-crane-platform:latest
    container_name: tower-crane-platform
    ports:
      - "4000:4000"
    volumes:
      - crane-data:/app/data
    environment:
      - PORT=4000
      - DB_PATH=/app/data/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  crane-data:
